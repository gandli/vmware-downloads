name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # 钉住 24.04：ubuntu-latest 于 2026-10-19 迁到 Ubuntu 26，
    # Playwright/Chromium 兼容未知，且月度任务挂了没人盯着（见 issue #45）
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
