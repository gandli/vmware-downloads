name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"  # 每周一 04:27 UTC

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    # 钉住 24.04：ubuntu-latest 于 2026-10-19 迁到 Ubuntu 26，
    # Playwright/Chromium 兼容未知，且月度任务挂了没人盯着（见 issue #45）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:python"
